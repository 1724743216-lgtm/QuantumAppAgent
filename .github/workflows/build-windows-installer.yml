name: Build Windows Installer

on:
  push:
    branches:
      - quantum-app-agent
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: DesktopApp/win-client/frontend
        run: npm install

      - name: Build Frontend
        working-directory: DesktopApp/win-client/frontend
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: DesktopApp/win-client/frontend/dist

  build-windows:
    needs: build-frontend
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: DesktopApp/win-client/frontend/dist

      - name: Install uv (Python Package Manager)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python
        run: uv python install 3.12

      - name: Setup Portable Python
        shell: bash
        run: |
          curl -LO https://github.com/indygreg/python-build-standalone/releases/download/20240415/cpython-3.12.3+20240415-x86_64-pc-windows-msvc-shared-install_only.tar.gz
          tar -xf cpython-*.tar.gz
          mv python backend_python

      - name: Install Python Backend Dependencies
        shell: bash
        run: |
          uv pip install --system --python backend_python/python.exe .
          
      - name: Compress Python Environment
        shell: bash
        run: |
          # 压缩环境以解决 NSIS 解压几万个小文件导致安装卡死（“一直在刷正在安装”）的问题
          tar -cf backend_python.tar backend_python
          rm -rf backend_python

      - name: Install Electron Dependencies
        working-directory: DesktopApp/win-client
        run: npm install

      - name: Build Windows NSIS Installer
        working-directory: DesktopApp/win-client
        run: npm run build:win

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Tianyan-Quantum-AI-Installer
          path: DesktopApp/win-client/dist/*.exe
